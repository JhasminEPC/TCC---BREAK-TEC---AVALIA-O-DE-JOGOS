<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Break Tec</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo">
                <span>Break Tec</span>
            </div>

            <h1>Criar conta</h1>

            <p class="subtitle">
                Cadastre-se para avaliar jogos, comentar e participar da comunidade.
            </p>

            <form id="cadastroForm">

                <!-- NOME -->
                <div class="input-group">

                    <label for="nome">Nome de usuário</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- SENHA -->
                <div class="input-group password-group">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="mostrarSenha"
                        aria-label="Mostrar senha">
                        👁
                    </button>

                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="input-group password-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="mostrarConfirmacao"
                        aria-label="Mostrar confirmação de senha">
                        👁
                    </button>

                </div>

                <!-- TERMOS -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="termos"
                        required
                    >

                    <label for="termos">
                        Concordo com os termos de uso da Break Tec.
                    </label>

                </div>

                <!-- MENSAGEM -->
                <p
                    id="cadastroMessage"
                    class="error-message">
                </p>

                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="next-button">

                    <span>Criar conta</span>

                    <span class="arrow">
                        →
                    </span>

                </button>

            </form>

            <div class="account-question">
    <span>Já possui uma conta?</span>

    <a href="login.html">
        Entrar
    </a>
</div>

            <a
                href="../index.html"
                class="back-home">
                Voltar ao início
            </a>

        </section>

    </main>

    <script src="../js/cadastro.js"></script>

</body>

</html>
